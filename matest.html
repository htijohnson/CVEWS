<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 SuperMini Monitor</title>
    <!-- MQTT.js Library -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2f;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #27293d;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            text-align: center;
            width: 320px;
        }
        h2 {
            margin-top: 0;
            font-size: 20px;
            color: #a9a9b9;
        }
        .status {
            font-size: 13px;
            font-weight: 600;
            color: #ff9800;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .connected { color: #00e676; }
        .disconnected { color: #ff5252; }
        .voltage-display {
            font-size: 56px;
            font-weight: bold;
            color: #00d6ef;
            margin: 10px 0;
        }
        .unit {
            font-size: 24px;
            color: #8f92a1;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Loop Voltage</h2>
    <div id="status" class="status">Connecting to HiveMQ...</div>
    <div class="voltage-display">
        <span id="voltage">--.--</span> <span class="unit">V</span>
    </div>
</div>

<script>
    // Broker WebSocket Details
    const brokerUrl = "wss://91edf0b43131429b9a2d60d852310ada.s1.eu.hivemq.cloud:8884/mqtt";
    const options = {
        username: "matest",
        password: "test1234",
        clientId: "SuperMiniDashboard_" + Math.random().toString(16).substr(2, 8)
    };

    const topic = "esp32/sensor/voltage";
    const statusDiv = document.getElementById("status");
    const voltageSpan = document.getElementById("voltage");

    // Establish WebSocket Connection
    const client = mqtt.connect(brokerUrl, options);

    client.on("connect", () => {
        statusDiv.innerText = "Online";
        statusDiv.className = "status connected";
        console.log("Connected to HiveMQ WSS");
        client.subscribe(topic);
    });

    client.on("message", (recvTopic, message) => {
        if (recvTopic === topic) {
            voltageSpan.innerText = message.toString();
        }
    });

    client.on("error", (err) => {
        console.error("Connection error:", err);
        statusDiv.innerText = "Connection Error";
        statusDiv.className = "status disconnected";
    });

    client.on("close", () => {
        statusDiv.innerText = "Disconnected";
        statusDiv.className = "status disconnected";
    });
</script>

</body>
</html>
