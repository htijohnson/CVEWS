<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLC Telemetry Dashboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 24px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #334155;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      background: #1e293b;
      border: 1px solid #334155;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
    }
    .dot.connected { background: #22c55e; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
    }
    .card-value {
      font-size: 1.4rem;
      font-weight: 700;
      color: #f1f5f9;
      word-break: break-all;
    }
    .terminal-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .terminal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: #94a3b8;
    }
    #logBox {
      background-color: #020617;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 12px;
      font-family: monospace;
      font-size: 0.85rem;
      height: 250px;
      overflow-y: auto;
      color: #38bdf8;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .log-item {
      line-height: 1.4;
    }
    .log-time {
      color: #64748b;
      margin-right: 8px;
    }
    .clear-btn {
      background: #334155;
      border: none;
      color: #cbd5e1;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
    }
    .clear-btn:hover { background: #475569; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>PLC Live Telemetry</h1>
      <div class="badge">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Connecting...</span>
      </div>
    </header>

    <div class="grid">
      <div class="card">
        <div class="card-label">ESP32 Status</div>
        <div class="card-value" id="valEspStatus">--</div>
      </div>

      <div class="card">
        <div class="card-label">ESP32 Local IP</div>
        <div class="card-value" id="valIp">--</div>
      </div>

      <div class="card" style="grid-column: 1 / -1;">
        <div class="card-label">Latest PLC Raw Telemetry (plc/data/raw)</div>
        <div class="card-value" id="valPlcData" style="color: #38bdf8;">Waiting for data...</div>
      </div>
    </div>

    <div class="terminal-card">
      <div class="terminal-header">
        <span>MQTT INCOMING FEED</span>
        <button class="clear-btn" onclick="clearLog()">Clear Log</button>
      </div>
      <div id="logBox"></div>
    </div>
  </div>

  <script>
    const host = "91edf0b43131429b9a2d60d852310ada.s1.eu.hivemq.cloud";
    const port = 8884;
    const path = "/mqtt";
    // Using the verified username without the extra 'i'
    const username = "cvewstelemetry1";
    const password = "water123";

    const clientId = "WebClient-" + Math.random().toString(16).substr(2, 8);

    const client = new Paho.MQTT.Client(host, port, path, clientId);

    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const valEspStatus = document.getElementById("valEspStatus");
    const valIp = document.getElementById("valIp");
    const valPlcData = document.getElementById("valPlcData");
    const logBox = document.getElementById("logBox");

    client.onConnectionLost = (responseObject) => {
      statusDot.classList.remove("connected");
      statusText.innerText = "Disconnected";
      addLog("System", "Connection lost: " + responseObject.errorMessage);
      setTimeout(connectClient, 5000);
    };

    client.onMessageArrived = (message) => {
      const topic = message.destinationName;
      const payload = message.payloadString;

      addLog(topic, payload);

      if (topic === "plc/esp32/status") {
        valEspStatus.innerText = payload.toUpperCase();
      } else if (topic === "plc/esp32/ip") {
        valIp.innerText = payload;
      } else if (topic === "plc/data/raw") {
        valPlcData.innerText = payload;
      }
    };
